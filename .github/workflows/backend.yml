name: Backend and Terraform checks
on:
  pull_request:
    paths: ['backend/**', 'terraform/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'terraform/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Disposable PostgreSQL 17 integration tests
        run: npm run test:integration
        env:
          CONTAINER_ENGINE: docker
      - run: npm run build
      - run: npm run audit
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: backend
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - name: Validate both environments without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          for environment in staging production; do
            terraform -chdir="terraform/environments/$environment" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="terraform/environments/$environment" validate
          done
      - name: Mocked infrastructure security plans (no AWS calls or apply)
        shell: bash
        run: |
          set -euo pipefail
          for module in network database api; do
            terraform -chdir="terraform/modules/$module" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="terraform/modules/$module" test
          done
